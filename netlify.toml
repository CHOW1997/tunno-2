[build]
  command = "npm install && npm run build"
  publish = "build"
  [build.caching]
    enabled = true
    paths = ["node_modules/.cache", "public/build"]

[build.environment]
  SUPABASE_URL = "YOUR_SUPABASE_URL"
  SUPABASE_KEY = "YOUR_SUPABASE_KEY"

  
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200